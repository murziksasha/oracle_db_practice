services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: oracle-practice
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=oracle
      - APP_USER=HR
      - APP_USER_PASSWORD=hr
    shm_size: 1gb
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

volumes:
  oracle-data:

